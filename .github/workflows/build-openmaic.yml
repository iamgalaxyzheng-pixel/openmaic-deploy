name: Build OpenMAIC v1.0.3

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the audited release commit
        uses: actions/checkout@v4
        with:
          repository: THU-MAIC/OpenMAIC
          ref: e693e11a81644f84c258df73dbda378643520a62
          persist-credentials: false

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = e693e11a81644f84c258df73dbda378643520a62

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openmaic:v1.0.3
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=e693e11a81644f84c258df73dbda378643520a62
          build-args: |
            NEXT_PUBLIC_PERSISTENCE=1
            NEXT_PUBLIC_PERSISTENCE_TOKEN=openmaic-tailnet-single-user-v1
          provenance: true
          sbom: true

